name: Sync projects

# Star counts and npm downloads are rendered from content/projects.json at
# build time, so "daily" means a daily commit to that file — which is also a
# daily deploy. 11:00 UTC is 4am in Los Angeles, the quietest hour to spend a
# release on.
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

# Two syncs would race on the same file and the same push.
concurrency:
  group: projects-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Resync stars and downloads
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The script reads `gh api user` and `user/orgs` to discover which owners
      # to walk. GITHUB_TOKEN represents the repository rather than a person and
      # answers 403 to both, so the script falls back to its own ORG_ORDER list
      # — correct, just fixed. Set a PROJECTS_TOKEN secret (a classic PAT with
      # `read:org` and `public_repo`) to have orgs discovered instead.
      - name: Regenerate content/projects.json
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN || secrets.GITHUB_TOKEN }}
        run: bun scripts/fetch-projects.ts

      # A run that reaches neither GitHub nor npm would happily write an empty
      # file and commit it. Refuse to push anything that lost most of the list.
      # A run that reaches neither GitHub nor npm would happily write an empty
      # file, and one whose owner list has gone stale writes a quietly shorter
      # one. Both are worse than a failed sync, so compare against what is
      # committed and refuse anything that lost repos or whole orgs.
      - name: Sanity-check the result
        run: |
          read -r count orgs paid < <(bun -e '
            const d = JSON.parse(await Bun.file("content/projects.json").text())
            console.log(d.repos.length, new Set(d.repos.map(r => r.org)).size, d.repos.filter(r => r.downloads).length)
          ')
          read -r wasCount wasOrgs wasPaid < <(git show HEAD:content/projects.json | bun -e '
            const d = JSON.parse(await Bun.stdin.text())
            console.log(d.repos.length, new Set(d.repos.map(r => r.org)).size, d.repos.filter(r => r.downloads).length)
          ')
          echo "repos: ${wasCount} -> ${count}, orgs: ${wasOrgs} -> ${orgs}, with downloads: ${wasPaid} -> ${paid}"
          if [ "$count" -lt 50 ]; then
            echo "::error::only ${count} repos came back — refusing to commit a truncated list"
            exit 1
          fi
          if [ "$orgs" -lt "$wasOrgs" ]; then
            echo "::error::orgs dropped ${wasOrgs} -> ${orgs}; ORG_ORDER in scripts/fetch-projects.ts is probably stale"
            exit 1
          fi
          # npm throttles a run that asks too fast, and a throttled lookup is
          # indistinguishable from "this package does not exist" unless someone
          # checks. The script retries; this catches the case where retrying was
          # not enough, rather than publishing a page that quietly lost counts.
          if [ "$paid" -lt "$wasPaid" ]; then
            echo "::error::download counts dropped ${wasPaid} -> ${paid}; npm likely throttled the run"
            exit 1
          fi

      - name: Commit if anything moved
        run: |
          if git diff --quiet -- content/projects.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/projects.json
          git commit -m "chore(projects): resync stars and npm downloads"
          git push
