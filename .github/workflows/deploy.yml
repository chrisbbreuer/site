name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Two overlapping runs would race for the same release
# directory and the same systemd units on a box shared with a dozen tenants.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # A deploy either finishes or fails; it never legitimately runs for an
    # hour. Without a ceiling a hung step holds the concurrency lock above and
    # blocks every later deploy too.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `buddy deploy` packages the working directory rather than the commit,
      # so deploying from a laptop ships whatever happens to be checked out.
      # A clean checkout here means the release is exactly the commit that
      # triggered it.
      - name: Authorise the deploy key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # ts-cloud reads the public half off disk to register the key with the
          # server, so it has to be present as well as the private one. Derived
          # rather than stored as a second secret: it is the same key, and two
          # secrets that must agree will eventually disagree.
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          chmod 644 ~/.ssh/id_ed25519.pub
          # This repo has no host-key secret, and the deploy resolves the box
          # by IP through the Hetzner API, so there is no fixed name to scan
          # for ahead of time. `accept-new` trusts the key seen on first
          # connection and refuses it if it ever changes — weaker than pinning,
          # stronger than disabling the check. Add a DEPLOY_HOST_KEY secret and
          # append it to known_hosts here to close the first-connection gap.
          printf 'Host *\n  StrictHostKeyChecking accept-new\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy
        env:
          APP_ENV: production
          # Satisfies the deploy's APP_KEY precondition on a runner, which has
          # no plaintext .env to read one from and would otherwise generate a
          # fresh key.
          APP_KEY: ${{ secrets.APP_KEY }}
          # The deploy resolves the box through the Hetzner API even when it is
          # attaching to one the `stacks` project owns rather than provisioning.
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: ./buddy deploy --prod --yes

      - name: Check the site answers
        run: |
          for path in / /blog; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "https://chrisbreuer.me${path}")
            echo "${path} -> ${code}"
            case "$code" in
              2*|3*) ;;
              *) echo "::error::chrisbreuer.me${path} answered ${code}"; exit 1 ;;
            esac
          done
