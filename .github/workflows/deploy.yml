name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

# One deploy at a time; a queued push waits for the running one to finish
# rather than cancelling it mid-release.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up SSH deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 178.105.248.188 >> ~/.ssh/known_hosts 2>/dev/null
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy to Hetzner (attach to shared box)
        run: ./buddy deploy --prod --yes
        env:
          APP_ENV: production
          APP_URL: chrisbreuer.me
          APP_KEY: ${{ secrets.APP_KEY }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}
          MAIL_PASSWORD_HI: ${{ secrets.MAIL_PASSWORD_HI }}
          MAIL_PASSWORD_CHRIS: ${{ secrets.MAIL_PASSWORD_CHRIS }}
          # Pins the management-dashboard htpasswd so each deploy doesn't
          # rotate it (see .ts-cloud/dashboard-credentials.json).
          TS_CLOUD_UI_PASSWORD: ${{ secrets.TS_CLOUD_UI_PASSWORD }}

      - name: Verify the live site
        run: |
          set -e
          for p in / /about /projects /uses /blog; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://chrisbreuer.me$p")
            echo "$p -> $code"
            [ "$code" = "200" ]
          done
          curl -s --max-time 30 https://chrisbreuer.me/ | grep -q 'chris breuer'
