name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Two overlapping runs would race for the same release
# directory and the same systemd units on a box shared with a dozen tenants.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # A deploy either finishes or fails; it never legitimately runs for an
    # hour. Without a ceiling a hung step holds the concurrency lock above and
    # blocks every later deploy too.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `./buddy` bootstraps a per-project pantry when `pantry/` is absent, and
      # that bootstrap tries to install bun.sh 1.3.14 over the bun currently
      # executing it — which fails on a runner with `FileBusy`, taking the
      # deploy with it.
      #
      # The script's own fast path is the answer: an existing `pantry/` plus a
      # bun on PATH means it trusts that state and runs directly. setup-bun
      # above already provides 1.3.14, the exact version the pantry would have
      # fetched, so there is nothing left for the bootstrap to do.
      - name: Skip the pantry bootstrap, the runner already has the pinned Bun
        run: mkdir -p pantry

      # `buddy deploy` packages the working directory rather than the commit,
      # so deploying from a laptop ships whatever happens to be checked out.
      # A clean checkout here means the release is exactly the commit that
      # triggered it.
      - name: Authorise the deploy key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # ts-cloud reads the public half off disk to register the key with the
          # server, so it has to be present as well as the private one. Derived
          # rather than stored as a second secret: it is the same key, and two
          # secrets that must agree will eventually disagree.
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          chmod 644 ~/.ssh/id_ed25519.pub
          # This repo has no host-key secret, and the deploy resolves the box
          # by IP through the Hetzner API, so there is no fixed name to scan
          # for ahead of time. `accept-new` trusts the key seen on first
          # connection and refuses it if it ever changes — weaker than pinning,
          # stronger than disabling the check. Add a DEPLOY_HOST_KEY secret and
          # append it to known_hosts here to close the first-connection gap.
          printf 'Host *\n  StrictHostKeyChecking accept-new\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy
        env:
          APP_ENV: production
          # Satisfies the deploy's APP_KEY precondition on a runner, which has
          # no plaintext .env to read one from and would otherwise generate a
          # fresh key.
          APP_KEY: ${{ secrets.APP_KEY }}
          # The deploy resolves the box through the Hetzner API even when it is
          # attaching to one the `stacks` project owns rather than provisioning.
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          # Decrypts .env.production, where the DNS credentials live (Cloudflare
          # for the zone, Porkbun for the registrar). Those are deliberately NOT
          # listed here: a variable named here overrides the decrypted value,
          # and a secret that does not exist overrides it with "".
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
        run: ./buddy deploy --prod --yes

      # A release warms its stx image caches before it can answer anything, and
      # a single request right after the cutover judges the site on the worst
      # moment of its life. Those caches live in shared/ now, so the warm pass
      # is normally seconds — but a cold one (new photos, a wiped shared dir)
      # still needs room, and "not up yet" is not the same failure as "down".
      # Poll to a deadline instead: the run goes red only if it never answers.
      # Fifteen minutes because that is what a cold image pass measures at today;
      # it drops to seconds once the stx version mismatch below is resolved.
      - name: Check the site answers
        run: |
          deadline=$(( $(date +%s) + 900 ))
          for path in / /blog; do
            while :; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -m 20 "https://chrisbreuer.me${path}" || true)
              case "$code" in
                2*|3*) echo "${path} -> ${code}"; break ;;
              esac
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::chrisbreuer.me${path} still answered ${code} after 15 minutes"
                exit 1
              fi
              echo "${path} -> ${code}, still warming…"
              sleep 10
            done
          done
